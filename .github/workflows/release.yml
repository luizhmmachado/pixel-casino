name: Build and Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch: {}

env:
  QT_VERSION: "5.15.2"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Instalar Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          tools: tools_opensslv3_x64

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel

      - name: Empacotar (windeployqt)
        run: |
          mkdir deploy
          copy build\Release\pixel-casino.exe deploy\
          windeployqt --qmldir . deploy\pixel-casino.exe

      - name: Bundlar OpenSSL (QSslSocket carrega libssl/libcrypto em tempo de execução)
        shell: pwsh
        run: |
          $dlls = Get-ChildItem -Path "$env:IQTA_TOOLS" -Recurse -Include libssl-3-x64.dll, libcrypto-3-x64.dll -ErrorAction SilentlyContinue
          if (-not $dlls) { throw "OpenSSL 3 nao encontrado em $env:IQTA_TOOLS" }
          $dlls | Group-Object Name | ForEach-Object { $_.Group[0] } | Copy-Item -Destination deploy\ -Force
          Get-ChildItem deploy\lib*-3-x64.dll

      - name: Compactar
        run: Compress-Archive -Path deploy\* -DestinationPath pixel-casino-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: pixel-casino-windows.zip

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop

      - name: Instalar dependências de build
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgl1-mesa-dev libxkbcommon-x11-0 imagemagick libfuse2

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel "$(nproc)"

      - name: Preparar AppDir
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp build/pixel-casino AppDir/usr/bin/
          convert -background none images/icons/blackjack.svg -resize 256x256 AppDir/usr/share/icons/hicolor/256x256/apps/pixel-casino.png
          cat > AppDir/usr/share/applications/pixel-casino.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Pixel Casino
          Exec=pixel-casino
          Icon=pixel-casino
          Categories=Game;
          EOF

      - name: Bundlar OpenSSL (QSslSocket carrega libssl/libcrypto do sistema em tempo de execução)
        run: |
          sudo apt-get install -y libssl1.1
          mkdir -p AppDir/usr/lib
          cp -L /usr/lib/x86_64-linux-gnu/libssl.so.1.1 AppDir/usr/lib/
          cp -L /usr/lib/x86_64-linux-gnu/libcrypto.so.1.1 AppDir/usr/lib/

      - name: Baixar linuxdeploy
        run: |
          wget --tries=5 --timeout=30 --waitretry=10 --retry-connrefused "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          wget --tries=5 --timeout=30 --waitretry=10 --retry-connrefused "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Gerar AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          QML_SOURCES_PATHS: ${{ github.workspace }}/ui:${{ github.workspace }}
        run: |
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --desktop-file=AppDir/usr/share/applications/pixel-casino.desktop \
            --icon-file=AppDir/usr/share/icons/hicolor/256x256/apps/pixel-casino.png \
            --plugin qt \
            --output appimage

      - name: Renomear artefato
        run: mv Pixel*.AppImage pixel-casino-linux.AppImage || mv *.AppImage pixel-casino-linux.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: pixel-casino-linux.AppImage

  build-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar ferramentas Android
        run: |
          sdkmanager "platform-tools" "platforms;android-31" "build-tools;31.0.0" "ndk;21.3.6528147"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/21.3.6528147" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/21.3.6528147" >> "$GITHUB_ENV"

      - name: Instalar Qt para Android
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: android
          arch: android

      - name: Selecionar Java 8 para o Gradle do Qt 5.15.2
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Baixar OpenSSL para Android
        run: git clone --depth 1 https://github.com/KDAB/android_openssl.git

      - name: Build e empacotamento APK
        run: |
          ANDROID_SYSROOT="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          ANDROID_SYSROOT_LIB_API="$ANDROID_SYSROOT/usr/lib/aarch64-linux-android/23"
          ANDROID_SYSROOT_LIB="$ANDROID_SYSROOT/usr/lib/aarch64-linux-android"

          cmake -S . -B build-android \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-23 \
            -DCMAKE_EXE_LINKER_FLAGS="-L$ANDROID_SYSROOT_LIB_API -L$ANDROID_SYSROOT_LIB -Wl,-rpath-link,$ANDROID_SYSROOT_LIB_API -Wl,-rpath-link,$ANDROID_SYSROOT_LIB" \
            -DCMAKE_SHARED_LINKER_FLAGS="-L$ANDROID_SYSROOT_LIB_API -L$ANDROID_SYSROOT_LIB -Wl,-rpath-link,$ANDROID_SYSROOT_LIB_API -Wl,-rpath-link,$ANDROID_SYSROOT_LIB" \
            -DCMAKE_PREFIX_PATH="$Qt5_DIR/lib/cmake;$Qt5_DIR" \
            -DQt5_DIR="$Qt5_DIR/lib/cmake/Qt5" \
            -DQt5Concurrent_DIR="$Qt5_DIR/lib/cmake/Qt5Concurrent" \
            -DQt5Core_DIR="$Qt5_DIR/lib/cmake/Qt5Core" \
            -DQt5Gui_DIR="$Qt5_DIR/lib/cmake/Qt5Gui" \
            -DQt5Quick_DIR="$Qt5_DIR/lib/cmake/Qt5Quick" \
            -DQt5Qml_DIR="$Qt5_DIR/lib/cmake/Qt5Qml" \
            -DQt5QmlModels_DIR="$Qt5_DIR/lib/cmake/Qt5QmlModels" \
            -DQt5Network_DIR="$Qt5_DIR/lib/cmake/Qt5Network" \
            -DQt5Sql_DIR="$Qt5_DIR/lib/cmake/Qt5Sql" \
            -DQt5Svg_DIR="$Qt5_DIR/lib/cmake/Qt5Svg" \
            -DQt5Widgets_DIR="$Qt5_DIR/lib/cmake/Qt5Widgets"
          cmake --build build-android --parallel "$(nproc)"
          cmake --install build-android --prefix android-build
          androiddeployqt \
            --input build-android/android-pixel-casino-deployment-settings.json \
            --output android-build \
            --android-platform android-31 \
            --apk android-build/pixel-casino.apk
          find . -type f -name "*.apk" -exec cp {} pixel-casino-android.apk \;

      - uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: pixel-casino-android.apk

  release:
    needs: [build-windows, build-linux, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows-build/pixel-casino-windows.zip
            artifacts/linux-build/pixel-casino-linux.AppImage
            artifacts/android-build/pixel-casino-android.apk
